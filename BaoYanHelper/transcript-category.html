<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩单分类选择</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #50E3C2;
            --text-color: #333333;
            --background-color: #F5F7FA;
            --card-background: #FFFFFF;
            --border-radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --spacing: 20px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            color: #666;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }
        
        .category-card {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 150px;
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        

        
        .category-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }
        
        .category-description {
            color: #666;
            font-size: 0.95rem;
        }
        
        .back-button {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 40px;
            height: 40px;
            background-color: #E0E0E0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
            z-index: 1000;
        }
        
        .back-button:hover {
            background-color: #D0D0D0;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .category-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .category-card {
                padding: 25px;
            }
            
            .back-button {
                top: 20px;
                left: 20px;
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="back-button" id="backButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
    </div>
    
    <div class="container">
        <div class="header">
            <h1>成绩单分类选择</h1>
            <p>请选择您要查看的加分类型，查看详细的成绩单信息</p>
        </div>
        
        <div class="category-grid">
            <div class="category-card" data-category="scientific-competition">
                <h2 class="category-title">科研竞赛</h2>
                <p class="category-description">查看您在科研竞赛中获得的加分项及分数</p>
            </div>
            
            <div class="category-card" data-category="social-work">
                <h2 class="category-title">社会工作</h2>
            <p class="category-description">查看您在社会工作中获得的加分项及分数</p>
            </div>
            
            <div class="category-card" data-category="honor-title">
                <h2 class="category-title">荣誉称号</h2>
                <p class="category-description">查看您获得的荣誉称号及对应的加分项</p>
            </div>
            
            <div class="category-card" data-category="other">
                <h2 class="category-title">其他加分</h2>
                <p class="category-description">查看其他类型的加分项及分数</p>
            </div>
        </div>
    </div>
    
    <script>
        // 返回按钮事件
        document.getElementById('backButton').addEventListener('click', function() {
            window.location.href = 'student-dashboard.html';
        });
        
        // 分类卡片点击事件
        document.querySelectorAll('.category-card').forEach(card => {
            card.addEventListener('click', function() {
                const category = this.getAttribute('data-category');
                // 根据选择的分类导航到对应的成绩单详细页面
                window.location.href = `transcript-detail.html?category=${category}`;
            });
        });
    </script>
</body>
</html>
