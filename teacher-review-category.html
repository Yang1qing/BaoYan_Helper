<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核管理 - XMU保研小助手</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/adaptive-layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2D96C5;
            --primary-light: #82D8FF;
            --primary-dark: #00B3F8;
            --white: #FFFFFF;
            --gray: #F0F0F0;
            --text-primary: #333333;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4FEFF;
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='100%25' y2='0'%3E%3Cstop offset='0' stop-color='%23F4FEFF'/%3E%3Cstop offset='100%25' stop-color='%23E6F8FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23a)'/%3E%3C/svg%3E");
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        
        .content-wrapper {
            width: 100%;
            max-width: 1920px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 169px;
            box-sizing: border-box;
        }
        
        .title {
            font-size: 64px;
            font-weight: 400;
            color: var(--white);
            text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            margin-bottom: 109px;
        }
        
        .main-content {
            position: relative;
            width: 1638px;
            min-height: 750px;
            background-color: rgba(253, 253, 253, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        
        .back-button {
            position: absolute;
            top: 40px;
            left: 40px;
            height: 48px;
            padding: 0 24px;
            border: none;
            background-color: var(--primary-color);
            border-radius: 24px;
            font-size: 20px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background-color: var(--primary-dark);
        }
        
        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 30px;
            width: 380px;
            flex-shrink: 0;
        }
        
        .application-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-left: 40px;
        }
        
        .application-header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .application-title {
            font-size: 40px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 20px;
        }
        
        .application-description {
            font-size: 18px;
            color: #666666;
            margin: 0;
        }
        
        .application-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 80%;
        }
        
        .application-btn {
            height: 150px;
            border: 2px solid var(--primary-color);
            background-color: var(--white);
            border-radius: 15px;
            font-size: 24px;
            font-weight: 500;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .application-btn:hover {
            background-color: var(--primary-color);
            color: var(--white);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(45, 150, 197, 0.2);
        }
        
        .pending-count {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #FF4D4F;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 500;
            min-width: 30px;
            text-align: center;
        }
        
        /* 通知样式 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
        }
        
        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }
        
        .notification__icon {
            font-size: 20px;
        }
        
        .notification__message {
            font-size: 16px;
        }
        
        /* 响应式设计 */
        @media (max-width: 1700px) {
            .main-content {
                width: 90%;
                max-width: 1638px;
            }
        }
        
        @media (max-width: 1200px) {
            .application-buttons {
                grid-template-columns: 1fr;
                width: 90%;
            }
            
            .application-btn {
                height: 120px;
                font-size: 20px;
            }
        }
        
        @media (max-width: 768px) {
            .content-wrapper {
                padding-top: 100px;
            }
            
            .title {
                font-size: 40px;
                margin-bottom: 50px;
            }
            
            .main-content {
                padding: 20px;
                min-height: auto;
            }
            
            .back-button {
                top: 20px;
                left: 20px;
                height: 40px;
                padding: 0 20px;
                font-size: 16px;
            }
            
            .application-container {
                margin-left: 0;
                margin-top: 40px;
            }
            
            .application-title {
                font-size: 30px;
            }
            
            .application-description {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <h1 class="title">XMU保研小助手</h1>
            
            <div class="main-content">
                <button id="back-button" class="back-button">→ 返回</button>
                
                <div class="application-container">
                    <div class="application-header">
                        <h2 class="application-title">审核管理</h2>
                        <p class="application-description">请选择您要审核的加分类型</p>
                    </div>
                    
                    <!-- 审核类型按钮组 -->
                    <div class="application-buttons">
                        <button class="application-btn" data-category="scientific-competition">
                            科研竞赛
                            <span class="pending-count">5</span>
                        </button>
                        <button class="application-btn" data-category="honor-title">
                            荣誉称号
                            <span class="pending-count">7</span>
                        </button>
                        <button class="application-btn" data-category="social-work">
                            社会工作
                            <span class="pending-count">3</span>
                        </button>
                        <button class="application-btn" data-category="other">
                            其他
                            <span class="pending-count">2</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 通知 -->
    <div id="notification" class="notification">
        <span class="notification__icon">✓</span>
        <span class="notification__message">操作成功</span>
    </div>
    
    <script src="/static/script.js"></script>
    <script>
        // 返回按钮事件
        document.getElementById('back-button').addEventListener('click', function() {
            window.history.back();
        });
        
        // 分类按钮点击事件 - 跳转到审核详情页面
        document.querySelectorAll('.application-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const category = this.getAttribute('data-category');
                console.log('选择的审核分类:', category);
                // 跳转到审核详情页面，并携带分类参数
                window.location.href = `teacher-review-detail.html?category=${category}`;
            });
        });
        
        // 动态更新待审核数量
        async function updatePendingCounts() {
            try {
                const response = await fetch('/api/teachers/pending-counts');
                const data = await response.json();
                
                if (data.code === 200) {
                    const counts = data.counts;
                    
                    // 更新每个分类按钮的待审核数量
                    Object.keys(counts).forEach(category => {
                        const button = document.querySelector(`[data-category="${category}"]`);
                        if (button) {
                            const pendingElement = button.querySelector('.pending-count');
                            if (pendingElement) {
                                if (counts[category] > 0) {
                                    pendingElement.textContent = counts[category];
                                    pendingElement.style.display = 'inline-block'; // 显示红点
                                } else {
                                    pendingElement.style.display = 'none'; // 隐藏红点
                                }
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('获取待审核数量失败:', error);
            }
        }
        
        // 页面加载时更新待审核数量
        document.addEventListener('DOMContentLoaded', updatePendingCounts);
    </script>
</body>
</html>
