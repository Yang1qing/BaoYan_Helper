<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录 - BaoYanHelper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            margin-top: 0;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.5rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            margin-top: 1rem;
            text-align: center;
            min-height: 20px;
        }
        .test-accounts {
            margin-top: 1rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #666;
        }
        .test-accounts h4 {
            margin: 0 0 0.5rem 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>用户登录</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="userType">用户类型</label>
                <select id="userType" name="userType" required>
                    <option value="student">学生</option>
                    <option value="teacher">教师</option>
                </select>
            </div>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">登录</button>
            <div id="message" class="message"></div>
        </form>
        
        <div class="test-accounts">
            <h4>测试账号：</h4>
            <p><strong>学生：</strong> student001 / 123456</p>
            <p><strong>教师：</strong> teacher001 / 654321</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const userType = document.getElementById('userType').value;
            const messageEl = document.getElementById('message');
            
            // 显示加载状态
            messageEl.style.color = 'blue';
            messageEl.textContent = '正在登录...';
            
            console.log('=== 登录调试信息 ===');
            console.log('用户名:', username);
            console.log('密码:', password);
            console.log('用户类型:', userType);
            
            // 发送登录请求 - 包含角色参数
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    username: username, 
                    password: password,
                    role: userType  // 使用用户选择的角色
                })
            })
            .then(response => {
                console.log('API响应状态:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('登录API返回数据:', data);
                
                if (data.code === 200) {
                    messageEl.style.color = 'green';
                    messageEl.innerHTML = `
                        <div style="line-height: 1.5;">
                            ✅ 登录成功！<br>
                            用户：${data.data.user_name}<br>
                            角色：${data.data.role}<br>
                            正在跳转到工作台...
                        </div>
                    `;
                    
                    // 存储完整的用户信息到localStorage，确保与主页登录逻辑一致
                    if (data.data.token) {
                        localStorage.setItem('authToken', data.data.token);
                        console.log('✅ 保存authToken成功');
                    }
                    
                    const userRole = data.data.role;
                    localStorage.setItem('userRole', userRole);
                    localStorage.setItem('userType', userRole);  // 确保userType字段与userRole一致
                    localStorage.setItem('userName', data.data.user_name);
                    
                    console.log('✅ 保存用户信息成功:', {
                        userRole: userRole,
                        userType: userRole,
                        userName: data.data.user_name,
                        hasToken: !!data.data.token
                    });

                    // 登录成功，根据用户类型跳转到相应的工作台
                    setTimeout(() => {
                        let targetUrl;
                        if (userRole === 'teacher') {
                            targetUrl = '/teacher-dashboard.html';
                            console.log('🎓 跳转到教师工作台:', targetUrl);
                        } else {
                            targetUrl = '/student-dashboard.html';
                            console.log('🎓 跳转到学生工作台:', targetUrl);
                        }
                        
                        console.log('🚀 准备跳转:', targetUrl);
                        messageEl.innerHTML += `<br><small>跳转目标：${targetUrl}</small>`;
                        
                        // 使用立即跳转
                        window.location.href = targetUrl;
                    }, 2000);

                } else {
                    messageEl.style.color = 'red';
                    messageEl.textContent = `登录失败：${data.message || '账号或密码错误，请检查后重试'}`;
                    console.log('登录失败:', data.message);
                }
            })
            .catch(error => {
                messageEl.style.color = 'red';
                messageEl.innerHTML = `
                    <div style="line-height: 1.5;">
                        网络错误：${error.message}<br>
                        请检查：<br>
                        1. Flask应用是否正在运行<br>
                        2. 网络连接是否正常<br>
                        3. 控制台查看详细错误
                    </div>
                `;
                console.error('登录错误:', error);
            });
        });
    </script>
</body>
</html>
