<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目详情 - XMU保研小助手</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/adaptive-layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2D96C5;
            --primary-light: #82D8FF;
            --primary-dark: #00B3F8;
            --white: #FFFFFF;
            --gray: #F0F0F0;
            --text-primary: #333333;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4FEFF;
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='100%25' y2='0'%3E%3Cstop offset='0' stop-color='%23F4FEFF'/%3E%3Cstop offset='100%25' stop-color='%23E6F8FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23a)'/%3E%3C/svg%3E");
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        
        .content-wrapper {
            width: 100%;
            max-width: 1920px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 169px;
            box-sizing: border-box;
        }
        
        .title {
            font-size: 64px;
            font-weight: 400;
            color: var(--white);
            text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            margin-bottom: 109px;
        }
        
        .main-content {
            position: relative;
            width: 1638px;
            min-height: 750px;
            background-color: rgba(253, 253, 253, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-sizing: border-box;
            z-index: 1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        
        .header-container {
            position: relative;
            padding-left: 100px;
            text-align: center;
            margin-bottom: 50px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-button {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background-color: var(--primary-color);
            border-radius: 50%;
            border: none;
            color: var(--white);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 2;
        }
        
        .back-button:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .page-header {
            margin: 0;
        }
        
        .page-title {
            font-size: 48px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0;
        }
        
        .project-detail-container {
            margin-top: 80px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .project-card {
            background-color: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-primary);
        }
        
        .project-info {
            flex: 1;
        }
        
        .project-name {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        
        .project-category {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }
        
        .project-category.research {
            background-color: rgba(37, 99, 235, 0.1);
            color: #2563eb;
        }
        
        .project-category.social {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
        
        .project-category.honor {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }
        
        .project-category.other {
            background-color: rgba(100, 116, 139, 0.1);
            color: #64748b;
        }
        
        .approval-status {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .approval-status.approved {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
        }
        
        .approval-status.rejected {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--color-error);
        }
        
        .approval-status.pending {
            background-color: rgba(251, 191, 36, 0.1);
            color: var(--color-warning);
        }
        
        .project-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .detail-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .detail-value {
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .project-score {
            font-size: 24px !important;
            color: var(--primary-color) !important;
            font-weight: 600 !important;
        }
        
        .project-description {
            margin-bottom: 40px;
            padding: 20px;
            background-color: var(--bg-tertiary);
            border-radius: 15px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
        }
        
        .rejection-reason {
            margin-bottom: 40px;
            padding: 20px;
            background-color: rgba(239, 68, 68, 0.05);
            border-radius: 15px;
            border-left: 4px solid var(--color-error);
        }
        
        .rejection-reason h4 {
            color: var(--color-error);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .rejection-reason p {
            margin: 0;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .project-materials {
            margin-bottom: 20px;
        }
        
        .project-materials h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            color: var(--text-primary);
        }
        
        .materials-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .material-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background-color: var(--bg-tertiary);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .material-item:hover {
            background-color: rgba(37, 99, 235, 0.05);
        }
        
        .material-icon {
            width: 50px;
            height: 50px;
            background-color: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .material-info {
            flex: 1;
        }
        
        .material-name {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 5px;
        }
        
        .material-size {
            font-size: 14px;
            color: var(--text-muted);
        }
        
        .material-download {
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .material-download:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        
        /* 响应式设计 */
        @media (max-width: 1700px) {
            .main-content {
                width: 90%;
            }
        }
        
        @media (max-width: 1200px) {
            .title {
                font-size: 48px;
                margin-bottom: 50px;
            }
            
            .page-title {
                font-size: 36px;
            }
            
            .project-detail-container {
                max-width: 90%;
            }
            
            .project-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            
            .project-details {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 36px;
                text-align: center;
            }
            
            .content-wrapper {
                padding-top: 100px;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .back-button {
                width: 50px;
                height: 50px;
                font-size: 20px;
                top: 20px;
                left: 20px;
            }
            
            .project-card {
                padding: 25px;
            }
            
            .project-name {
                font-size: 24px;
            }
            
            .material-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .material-info {
                width: 100%;
            }
            
            .material-download {
                width: 100%;
                text-align: center;
            }
        }
        
        /* 通知 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--bg-primary);
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .notification--active {
            transform: translateX(0);
        }
        
        .notification__icon {
            font-size: 20px;
            color: var(--color-success);
        }
        
        .notification__message {
            color: var(--text-primary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <div class="title">XMU保研小助手</div>
            
            <div class="main-content">
                <div class="header-container">
                    <button class="back-button" id="back-button">←</button>
                    
                    <div class="page-header">
                        <h1 class="page-title">项目详情</h1>
                    </div>
                </div>
                
                <div class="project-detail-container">
                    <div class="project-card" id="project-content">
                        <!-- 项目详情内容将通过JavaScript动态加载 -->
                        <div class="loading" style="text-align: center; padding: 100px 0;">
                            <p>加载中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 通知 -->
    <div id="notification" class="notification" style="display: none;">
        <div class="notification__content">
            <div class="notification__icon">✓</div>
            <div class="notification__message">操作成功</div>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 返回按钮事件 - 修改为返回到上一页
            const backButton = document.getElementById('back-button');
            if (backButton) {
                backButton.addEventListener('click', function() {
                    window.history.back();
                });
            }
            
            // 获取URL中的参数
            const urlParams = new URLSearchParams(window.location.search);
            const recordId = urlParams.get('id');
            
            // 获取登录用户信息
            const userData = localStorage.getItem('userData');
            const currentUserName = userData ? JSON.parse(userData).name : '当前用户';
            
            // 老师列表 - 用于自动分配审核人
            const teachers = ['张老师', '李老师', '王老师', '刘老师', '陈老师'];
            
            // 根据状态设置不同的显示内容
            const statusText = {
                'approved': '已通过！',
                'rejected': '未通过',
                'pending': '审核中。'
            };
            
            // 根据类型设置类名 - 统一所有项目类型的映射
            const typeClassMap = {
                '科研竞赛': 'research',
                '荣誉称号': 'honor',
                '社会工作': 'social',
                '其他加分': 'other',
                '其他项目': 'other',
                '其他记录': 'other'
            };
            
            // 从API获取项目数据
            async function loadProjectData(id) {
                try {
                    const response = await fetch(`/api/applications/${id}`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
                            'Cache-Control': 'no-cache'
                        },
                        cache: 'no-store'
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP错误：${response.status}`);
                    }
                    
                    const data = await response.json();
                    return data.code === 200 ? data.data : null;
                } catch (error) {
                    console.error('获取项目数据失败:', error);
                    showNotification('加载失败: ' + error.message, 'error');
                    return null;
                }
            }
            
            // 转换API数据为前端所需格式
            function transformProjectData(apiData) {
                // 获取类型文本
                const getTypeText = (type) => {
                    const typeMap = {
                        'scientific_competition': '科研竞赛',
                        'social_work': '社会工作',
                        'honor_title': '荣誉称号',
                        'other': '其他加分',
                        'other_project': '其他项目',
                        'other_record': '其他记录'
                    };
                    return typeMap[type] || type;
                };
                
                // 随机选择一个老师作为审核人
                const randomTeacher = teachers[Math.floor(Math.random() * teachers.length)];
                
                // 处理材料数据，优先使用files字段（因为申报时使用的是files字段名）
                let materials = [];
                if (apiData.files) {
                    materials = apiData.files;
                } else if (apiData.materials) {
                    materials = apiData.materials;
                } else if (apiData.attachments) {
                    materials = apiData.attachments;
                }
                
                // 确保材料数据格式正确
                const formattedMaterials = materials.map(material => {
                    // 如果是字符串格式的文件名，转换为对象
                    if (typeof material === 'string') {
                        return {
                            name: material,
                            type: material.split('.').pop() || 'file',
                            size: '未知大小',
                            url: `/${material}` // 假设文件路径
                        };
                    }
                    // 确保对象有必要的属性
                    return {
                        name: material.name || material.filename || '未命名文件',
                        type: material.type || material.filetype || material.name?.split('.').pop() || 'file',
                        size: material.size || material.filesize || '未知大小',
                        url: material.url || material.path || material.filepath || `/${material.name || 'file'}`
                    };
                });
                
                return {
                    id: apiData.id,
                    name: apiData.title || '未命名项目',
                    categoryText: getTypeText(apiData.type),
                    category: typeClassMap[getTypeText(apiData.type)] || 'other',
                    reviewer: apiData.reviewer || randomTeacher,
                    isApproved: apiData.status === 'approved',
                    isPending: apiData.status === 'pending',
                    approvalDate: apiData.review_time || (apiData.status === 'pending' ? '审核中' : '未知'),
                    applicationDate: apiData.apply_time || '未知',
                    applicant: currentUserName,
                    description: apiData.description || '暂无项目描述',
                    rejectionReason: apiData.status === 'rejected' ? (apiData.review_remark || '暂无未通过原因') : '',
                    score: apiData.status === 'approved' ? (apiData.award_level || 0) : 0,
                    materials: formattedMaterials,
                    remarks: apiData.review_remark || ''
                };
            }
            
            // 渲染项目详情
            const projectContent = document.getElementById('project-content');
            
            // 加载并渲染项目数据
            async function loadAndRenderProject() {
                if (!projectContent || !recordId) {
                    projectContent.innerHTML = '<div style="text-align: center; padding: 100px 0;"><p>无效的项目ID</p></div>';
                    return;
                }
                
                // 显示加载状态
                projectContent.innerHTML = `
                    <div class="loading" style="text-align: center; padding: 100px 0;">
                        <p>加载中...</p>
                    </div>
                `;
                
                // 从API获取数据
                const apiData = await loadProjectData(recordId);
                if (!apiData) {
                    projectContent.innerHTML = '<div style="text-align: center; padding: 100px 0;"><p>无法加载项目数据</p></div>';
                    return;
                }
                
                // 转换数据格式
                const project = transformProjectData(apiData);
                if (!project) {
                    projectContent.innerHTML = '<div style="text-align: center; padding: 100px 0;"><p>数据格式错误</p></div>';
                    return;
                }
                
                let statusHTML = '';
                if (project.isPending) {
                    statusHTML = `<div class="approval-status pending">${statusText['pending']}</div>`;
                } else if (project.isApproved) {
                    statusHTML = `<div class="approval-status approved">${statusText['approved']}</div>`;
                } else {
                    statusHTML = `<div class="approval-status rejected">${statusText['rejected']}</div>`;
                }
                
                let rejectionReasonHTML = '';
                if (!project.isApproved && !project.isPending && project.rejectionReason) {
                    rejectionReasonHTML = `
                        <div class="rejection-reason">
                            <h4>未通过原因</h4>
                            <p>${project.rejectionReason}</p>
                        </div>
                    `;
                }
                
                // 渲染证明材料
                let materialsHTML = `
                    <div class="project-materials">
                        <h3>相关证明材料</h3>
                        <div class="materials-list">
                            ${project.materials.length > 0 ? project.materials.map(material => {
                                // 根据文件类型选择图标
                                let fileIcon = '📄';
                                if (material.type.includes('pdf')) fileIcon = '📄';
                                else if (material.type.includes('doc')) fileIcon = '📝';
                                else if (material.type.includes('jpg') || material.type.includes('png')) fileIcon = '🖼️';
                                else if (material.type.includes('zip') || material.type.includes('rar')) fileIcon = '🗜️';
                                
                                return `
                                    <div class="material-item">
                                        <div class="material-icon">${fileIcon}</div>
                                        <div class="material-info">
                                            <div class="material-name">${material.name}</div>
                                            <div class="material-size">${material.size}</div>
                                        </div>
                                        <a href="${material.url}" class="material-download" target="_blank">查看</a>
                                    </div>
                                `;
                            }).join('') : '<div style="padding: 20px; color: #999; text-align: center;">暂无证明材料</div>'}
                        </div>
                    </div>
                `;
                
                // 添加备注部分
                let remarksHTML = '';
                if (project.remarks) {
                    remarksHTML = `
                        <div class="project-remarks">
                            <h3>备注</h3>
                            <div class="project-description">
                                ${project.remarks}
                            </div>
                        </div>
                    `;
                }
                
                projectContent.innerHTML = `
                    <div class="project-header">
                        <div class="project-info">
                            <h2 class="project-name">${project.name}</h2>
                            <span class="project-category ${project.category}">${project.categoryText}</span>
                        </div>
                        ${statusHTML}
                    </div>
                    
                    <div class="project-details">
                        <div class="detail-item">
                            <span class="detail-label">申请时间</span>
                            <span class="detail-value">${project.applicationDate}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">申请人</span>
                            <span class="detail-value">${project.applicant}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">审核人</span>
                            <span class="detail-value">${project.reviewer}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">审核日期</span>
                            <span class="detail-value">${project.approvalDate}</span>
                        </div>
                        ${project.score > 0 ? `
                        <div class="detail-item">
                            <span class="detail-label">项目加分</span>
                            <span class="detail-value project-score">+${project.score}</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="project-description">
                        ${project.description}
                    </div>
                    
                    ${remarksHTML}
                    
                    ${materialsHTML}
                    
                    ${rejectionReasonHTML}
                `;
            }
            
            // 页面加载完成后执行
            if (recordId) {
                loadAndRenderProject();
            } else {
                projectContent.innerHTML = '<div style="text-align: center; padding: 100px 0;"><p>无效的项目ID</p></div>';
            }
        });
        
        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            if (notification) {
                const messageEl = notification.querySelector('.notification__message');
                const iconEl = notification.querySelector('.notification__icon');
                
                if (messageEl) messageEl.textContent = message;
                if (iconEl) {
                    iconEl.textContent = type === 'success' ? '✓' : '!';
                    iconEl.style.color = type === 'success' ? 'var(--color-success)' : 'var(--color-error)';
                }
                
                notification.style.display = 'flex';
                notification.classList.add('notification--active');
                
                setTimeout(() => {
                    notification.classList.remove('notification--active');
                    setTimeout(() => {
                        notification.style.display = 'none';
                    }, 300);
                }, 3000);
            }
        }
    </script>
</body>
</html>
