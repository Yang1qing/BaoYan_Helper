<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码找回 - BaoYanHelper</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 密码找回页面特定样式 */
        .reset-password {
            min-height: 100vh;
            background-color: #F4FEFF;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }
        
        /* 装饰性圆形元素 */
        .reset-password::before,
        .reset-password::after,
        .reset-password .decor-circle {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            z-index: 0;
        }
        
        .reset-password::before {
            width: 801px;
            height: 651px;
            background-color: rgba(227, 238, 217, 0.4);
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
        }
        
        .reset-password::after {
            width: 898px;
            height: 625px;
            background-color: rgba(204, 218, 255, 0.5);
            top: 60%;
            right: 15%;
            transform: translateY(-50%);
        }
        
        .reset-password .decor-circle {
            width: 139px;
            height: 137px;
            background-color: rgba(204, 218, 255, 0.5);
            top: 40%;
            left: 30%;
            filter: blur(120px);
        }

        .reset-password__content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
            padding: 40px;
            width: 100%;
            max-width: 1600px;
            position: relative;
            z-index: 1;
        }

        .reset-password__left {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .reset-password__avatar {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b3f8 0%, #82d8ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .reset-password__avatar-text {
            font-size: var(--font-size-4xl);
            font-weight: var(--font-weight-semibold);
            color: white;
            font-family: var(--font-family);
        }

        .reset-password__right {
            background-color: white;
            border-radius: 12px;
            padding: 50px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        .reset-password__title {
            text-align: center;
            margin-bottom: 40px;
        }

        .reset-password__title-text {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-medium);
            color: #62A9C9;
            font-family: var(--font-family);
            margin: 0;
        }

        .reset-password__form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .reset-password__input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reset-password__input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reset-password__input {
            width: 100%;
            height: 50px;
            border: 1px solid var(--border-secondary);
            border-radius: 4px;
            padding: 0 20px;
            font-size: var(--font-size-base);
            font-family: var(--font-family);
            color: var(--text-primary);
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }

        .reset-password__input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .reset-password__input--verification {
            flex: 1;
        }

        .reset-password__btn {
            height: 50px;
            border: none;
            border-radius: 4px;
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            font-family: var(--font-family);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-password__btn--primary {
            background-color: #2D96C5;
            color: white;
        }

        .reset-password__btn--primary:hover {
            background-color: #257ca3;
        }

        .reset-password__btn--secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-secondary);
        }

        .reset-password__btn--secondary:hover {
            background-color: var(--border-secondary);
        }

        .reset-password__btn--get-code {
            min-width: 120px;
            height: 50px;
            font-size: var(--font-size-sm);
        }

        .reset-password__links {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .reset-password__link {
            color: var(--color-info);
            text-decoration: none;
            font-size: var(--font-size-sm);
            transition: color 0.3s ease;
        }

        .reset-password__link:hover {
            color: var(--color-primary-hover);
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .reset-password__content {
                flex-direction: column;
                gap: 30px;
                padding: 20px;
            }

            .reset-password__avatar {
                width: 200px;
                height: 200px;
            }

            .reset-password__avatar-text {
                font-size: var(--font-size-3xl);
            }

            .reset-password__right {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 主要内容区域 -->
    <main class="main">
        <!-- 密码找回页面 -->
        <section id="reset-password" class="page page--active">
            <div class="reset-password">
                <!-- 装饰性圆形元素 -->
                <div class="decor-circle"></div>
                
                <!-- 主要内容容器 -->
                <div class="reset-password__content">
                    <!-- 左侧内容 -->
                    <div class="reset-password__left">
                        <div class="reset-password__avatar">
                            <span class="reset-password__avatar-text">XMU</span>
                        </div>
                    </div>
                    
                    <!-- 右侧密码找回区域 -->
                    <div class="reset-password__right">
                        <div class="reset-password__title">
                            <h1 class="reset-password__title-text">XMU       密码修改</h1>
                        </div>
                        
                        <form class="reset-password__form">
                            <div class="reset-password__input-group">
                                <input type="tel" class="reset-password__input" placeholder="请输入手机号" maxlength="11">
                            </div>
                            
                            <div class="reset-password__input-group">
                                <div class="reset-password__input-wrapper">
                                    <input type="text" class="reset-password__input reset-password__input--verification" placeholder="请输入验证码" maxlength="6">
                                    <button type="button" class="reset-password__btn reset-password__btn--secondary reset-password__btn--get-code">获取验证码</button>
                                </div>
                            </div>
                            
                            <button type="submit" class="reset-password__btn reset-password__btn--primary">
                                登    录
                            </button>
                        </form>
                        
                        <div class="reset-password__links">
                            <a href="help.html" class="reset-password__link">在线帮助</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 验证码按钮点击事件
        document.querySelector('.reset-password__btn--get-code').addEventListener('click', function() {
            const phoneInput = document.querySelector('.reset-password__input');
            const phoneNumber = phoneInput.value.trim();
            
            // 简单的手机号验证
            if (!/^1[3-9]\d{9}$/.test(phoneNumber)) {
                alert('请输入有效的手机号码');
                return;
            }
            
            // 禁用按钮并开始倒计时
            const btn = this;
            btn.disabled = true;
            let countdown = 60;
            btn.textContent = `${countdown}秒后重新获取`;
            
            const timer = setInterval(() => {
                countdown--;
                btn.textContent = `${countdown}秒后重新获取`;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                }
            }, 1000);
            
            // 这里可以添加发送验证码的API调用
            console.log('向手机号', phoneNumber, '发送验证码');
        });
        
        // 表单提交事件
        document.querySelector('.reset-password__form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phoneInput = document.querySelector('.reset-password__input');
            const codeInput = document.querySelector('.reset-password__input--verification');
            const phoneNumber = phoneInput.value.trim();
            const code = codeInput.value.trim();
            
            // 简单的表单验证
            if (!/^1[3-9]\d{9}$/.test(phoneNumber)) {
                alert('请输入有效的手机号码');
                return;
            }
            
            if (!/^\d{6}$/.test(code)) {
                alert('请输入6位数字验证码');
                return;
            }
            
            // 这里可以添加验证验证码的API调用
            console.log('验证手机号', phoneNumber, '的验证码', code);
            alert('验证成功！正在跳转到登录页面...');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
