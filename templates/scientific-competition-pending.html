<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研竞赛-审核中 - XMU保研小助手</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/adaptive-layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2D96C5;
            --primary-light: #82D8FF;
            --primary-dark: #00B3F8;
            --white: #FFFFFF;
            --gray: #F0F0F0;
            --text-primary: #333333;
            --text-gray: #999999;
            --pending-color: #FF9800;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4FEFF;
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='100%25' y2='0'%3E%3Cstop offset='0' stop-color='%23F4FEFF'/%3E%3Cstop offset='100%25' stop-color='%23E6F8FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23a)'/%3E%3C/svg%3E");
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        
        .content-wrapper {
            width: 100%;
            max-width: 1920px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 169px;
            box-sizing: border-box;
        }
        
        .title {
            font-size: 64px;
            font-weight: 400;
            color: var(--white);
            text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            margin-bottom: 109px;
        }
        
        .main-content {
            position: relative;
            width: 1638px;
            min-height: 750px;
            background-color: rgba(253, 253, 253, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        
        .back-button {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 120px;
            height: 45px;
            background: var(--primary-color);
            border-radius: 22.5px;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            z-index: 100;
            box-shadow: 0px 4px 12px rgba(45, 150, 197, 0.4);
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0px 6px 16px rgba(45, 150, 197, 0.5);
        }
        
        .back-button:active {
            transform: translateY(0);
            box-shadow: 0px 2px 8px rgba(45, 150, 197, 0.3);
        }
        
        .category-title {
            font-size: 40px;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 40px;
            margin-top: 10px;
            align-self: center;
        }
        
        .records-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .record-item {
            width: 100%;
            height: 120px;
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        .record-item:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        
        .record-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .record-name {
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .record-time {
            font-size: 16px;
            color: var(--text-gray);
        }
        
        .record-score {
            font-size: 28px;
            color: var(--pending-color);
            font-weight: 500;
        }
        
        /* 响应式设计 */
        @media (max-width: 1700px) {
            .main-content {
                width: 90%;
            }
        }
        
        @media (max-width: 1200px) {
            .main-content {
                min-height: 750px;
            }
            
            .title {
                font-size: 48px;
                margin-bottom: 50px;
            }
            
            .category-title {
                font-size: 32px;
            }
            
            .record-item {
                height: 100px;
                padding: 20px;
            }
            
            .record-name {
                font-size: 20px;
            }
            
            .record-time {
                font-size: 14px;
            }
            
            .record-score {
                font-size: 24px;
            }
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 36px;
                text-align: center;
            }
            
            .category-title {
                font-size: 28px;
            }
            
            .record-item {
                height: auto;
                min-height: 80px;
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .record-score {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回按钮 -->
        <button class="back-button" data-action="scientific-competition">
            <svg width="20" height="16" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 8H2M18 8L10 0M18 8L10 16" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            返回
        </button>
        
        <div class="content-wrapper">
            <div class="title">XMU保研小助手</div>
            
            <div class="main-content">
                <div class="category-title">科研竞赛</div>
                
                <div class="records-list">
                    <!-- 记录项 1 -->
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-name">全国大学生化学实验竞赛</div>
                            <div class="record-time">提交时间：2023-12-01</div>
                        </div>
                        <div class="record-score">审核中</div>
                    </div>
                    
                    <!-- 记录项 2 -->
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-name">"挑战杯"创业计划竞赛</div>
                            <div class="record-time">提交时间：2023-11-20</div>
                        </div>
                        <div class="record-score">审核中</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
