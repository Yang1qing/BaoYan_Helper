<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布公告 - XMU保研小助手</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/adaptive-layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2D96C5;
            --primary-light: #82D8FF;
            --primary-dark: #00B3F8;
            --white: #FFFFFF;
            --gray: #F0F0F0;
            --text-primary: #333333;
            --success-color: #52C41A;
            --border-color: #E0E0E0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4FEFF;
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='100%25' y2='0'%3E%3Cstop offset='0' stop-color='%23F4FEFF'/%3E%3Cstop offset='100%25' stop-color='%23E6F8FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23a)'/%3E%3C/svg%3E");
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        
        .content-wrapper {
            width: 100%;
            max-width: 1920px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 169px;
            box-sizing: border-box;
        }
        
        .title {
            font-size: 64px;
            font-weight: 400;
            color: var(--white);
            text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
            margin-bottom: 109px;
        }
        
        .main-content {
            position: relative;
            width: 1200px;
            min-height: 750px;
            background-color: rgba(253, 253, 253, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-sizing: border-box;
            z-index: 1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        
        .back-button {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 60px;
            height: 60px;
            background-color: var(--primary-color);
            border-radius: 50%;
            border: none;
            color: var(--white);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 2;
        }
        
        .back-button:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 50px;
            margin-top: 80px;
        }
        
        .page-title {
            font-size: 48px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0;
        }
        
        .announcement-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 40px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-label {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .form-input {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            background-color: var(--white);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(45, 150, 197, 0.1);
        }
        
        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            font-size: 18px;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            background-color: var(--white);
            resize: vertical;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(45, 150, 197, 0.1);
        }
        
        .form-actions {
            display: flex;
            gap: 20px;
            justify-content: flex-end;
            margin-top: 40px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(45, 150, 197, 0.3);
        }
        
        .btn-secondary {
            background-color: var(--gray);
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background-color: #E0E0E0;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .view-records-btn {
            position: absolute;
            top: 40px;
            right: 40px;
            padding: 15px 30px;
            font-size: 18px;
            background-color: var(--primary-light);
            color: var(--text-primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .view-records-btn:hover {
            background-color: #59C7FF;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(130, 216, 255, 0.3);
        }
        
        /* 响应式设计 */
        @media (max-width: 1400px) {
            .main-content {
                width: 90%;
            }
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 48px;
            }
            
            .page-title {
                font-size: 36px;
            }
            
            .form-label {
                font-size: 18px;
            }
            
            .form-input,
            .form-textarea {
                font-size: 16px;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .view-records-btn {
                position: static;
                margin-top: 20px;
                width: 100%;
            }
        }
        
        /* 通知样式 */
        .notification {
            position: fixed;
            top: 50px;
            right: 50px;
            background-color: var(--success-color);
            color: var(--white);
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification__icon {
            font-size: 24px;
        }
        
        .notification__message {
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <div class="title">XMU保研小助手</div>
            
            <div class="main-content">
                <!-- 返回按钮 -->
                <button class="back-button" id="backButton">←</button>
                
                <!-- 查看公告记录按钮 -->
                <button class="view-records-btn" id="viewRecordsBtn">查看已发布记录</button>
                
                <div class="page-header">
                    <h1 class="page-title">发布公告</h1>
                </div>
                
                <form class="announcement-form" id="announcementForm">
                    <div class="form-group">
                        <label for="announcementTitle" class="form-label">公告标题</label>
                        <input type="text" id="announcementTitle" class="form-input" placeholder="请输入公告标题" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="announcementContent" class="form-label">公告内容</label>
                        <textarea id="announcementContent" class="form-textarea" placeholder="请输入公告详细内容" required></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="resetButton">重置</button>
                        <button type="submit" class="btn btn-primary">发布公告</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- 通知 -->
    <div id="notification" class="notification">
        <div class="notification__icon">✓</div>
        <div class="notification__message">操作成功</div>
    </div>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 返回按钮事件
        document.getElementById('backButton').addEventListener('click', function() {
            window.location.href = 'teacher-dashboard.html';
        });
        
        // 查看已发布记录按钮事件
        document.getElementById('viewRecordsBtn').addEventListener('click', function() {
            window.location.href = 'teacher-announcement-records.html';
        });
        
        // 表单提交事件
        document.getElementById('announcementForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const title = document.getElementById('announcementTitle').value;
            const content = document.getElementById('announcementContent').value;
            
            // 创建公告对象
            const announcement = {
                id: Date.now(), // 使用时间戳作为唯一ID
                title: title,
                content: content,
                publishTime: new Date().toLocaleString('zh-CN'),
                publisher: '李老师' // 模拟教师信息
            };
            
            // 从localStorage获取现有公告或初始化空数组
            let announcements = JSON.parse(localStorage.getItem('teacherAnnouncements')) || [];
            
            // 添加新公告到数组开头
            announcements.unshift(announcement);
            
            // 保存到localStorage
            localStorage.setItem('teacherAnnouncements', JSON.stringify(announcements));
            
            // 同步到学生通知
            let studentNotifications = JSON.parse(localStorage.getItem('studentNotifications')) || [];
            studentNotifications.unshift({
                id: announcement.id,
                type: 'announcement',
                title: `公告：${announcement.title}`,
                content: announcement.content,
                time: announcement.publishTime,
                isRead: false
            });
            localStorage.setItem('studentNotifications', JSON.stringify(studentNotifications));
            
            // 显示成功通知
            showNotification('公告发布成功！');
            
            // 重置表单
            this.reset();
        });
        
        // 重置按钮事件
        document.getElementById('resetButton').addEventListener('click', function() {
            document.getElementById('announcementForm').reset();
        });
        
        // 显示通知函数
        function showNotification(message) {
            const notification = document.getElementById('notification');
            const notificationMessage = notification.querySelector('.notification__message');
            
            notificationMessage.textContent = message;
            notification.classList.add('show');
            
            // 3秒后隐藏通知
            setTimeout(function() {
                notification.classList.remove('show');
            }, 3000);
        }
    });
    </script>
</body>
</html>
