<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩单详情</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #50E3C2;
            --text-color: #333333;
            --background-color: #F5F7FA;
            --card-background: #FFFFFF;
            --border-radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --spacing: 20px;
            --score-box-height: 120px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
        }
        

        
        .score-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .score-box {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 25px;
            text-align: center;
            height: var(--score-box-height);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .score-box h3 {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 10px;
        }
        
        .score-box .score-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .score-details {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .score-details h2 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #E0E0E0;
        }
        
        .grade-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .grade-item {
            background-color: #F8FAFF;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .grade-item:last-child {
            margin-bottom: 0;
        }
        
        .grade-info {
            flex-grow: 1;
        }
        
        .grade-name {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 5px;
            color: var(--text-color);
        }
        
        .grade-date {
            font-size: 0.9rem;
            color: #666;
        }
        
        .grade-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            background-color: rgba(74, 144, 226, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
        }
        
        .back-button {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 40px;
            height: 40px;
            background-color: #E0E0E0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
            z-index: 1000;
        }
        
        .back-button:hover {
            background-color: #D0D0D0;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .score-overview {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .score-box {
                height: auto;
                padding: 20px;
            }
            
            .score-box .score-value {
                font-size: 2rem;
            }
            
            .score-details {
                padding: 20px;
            }
            
            .score-details h2 {
                font-size: 1.5rem;
            }
            
            .grade-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px;
            }
            
            .grade-score {
                margin-top: 10px;
                align-self: flex-end;
            }
            
            .back-button {
                top: 20px;
                left: 20px;
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="back-button" id="backButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
    </div>
    
    <div class="container">
        <div class="header">
            <h1 id="categoryTitle">成绩单详情</h1>
            <p id="categoryDescription">查看您在选定分类下的详细加分信息</p>
        </div>
        

        
        <div class="score-overview">
            <div class="score-box">
                <h3>总成绩</h3>
                <div class="score-value" id="totalScore">92.5</div>
            </div>
            
            <div class="score-box">
                <h3>学业成绩</h3>
                <div class="score-value" id="academicScore">85.0</div>
            </div>
            
            <div class="score-box">
                <h3 id="categoryScoreLabel">科研竞赛总分</h3>
                <div class="score-value" id="categoryScore">7.5</div>
            </div>
        </div>
        
        <div class="score-details">
            <h2 id="detailsTitle">科研竞赛加分明细</h2>
            <div class="grade-list" id="gradeList">
                <!-- 加分项目会通过JavaScript动态填充 -->
            </div>
        </div>
    </div>
    
    <script>
        // 获取URL参数中的分类
        function getCategoryFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('category') || 'scientific-competition';
        }
        
        // 更新页面内容
        async function updatePageContent() {
            const category = getCategoryFromUrl();
            
            try {
                // 并行获取分数数据和申请记录
                // 添加size参数以获取所有申请记录，避免分页导致的部分记录不显示
                const [scoreResponse, applicationsResponse] = await Promise.all([
                    fetch('/api/students/score'),
                    fetch('/api/students/applications?size=1000')
                ]);
                
                // 检查响应状态
                if (!scoreResponse.ok) {
                    throw new Error('Network response was not ok for score data');
                }
                
                if (!applicationsResponse.ok) {
                    throw new Error('Network response was not ok for applications data');
                }
                
                // 解析JSON数据
                const scoreData = await scoreResponse.json();
                const applicationsData = await applicationsResponse.json();
                
                if (scoreData.code === 200) {
                    const scoreDataResult = scoreData.data;
                    console.log('获取到的分数数据:', scoreDataResult);
                    
                    // 更新学业成绩
                    const academicScore = scoreDataResult.academic_score;
                    document.getElementById('academicScore').textContent = academicScore.toFixed(1);

                    // 分类数据映射
                    const categoryMap = {
                        'scientific-competition': {
                            title: '科研竞赛',
                            description: '查看您在科研竞赛中获得的详细加分信息',
                            scoreLabel: '科研竞赛总分',
                            detailsTitle: '科研竞赛加分明细',
                            items: [], // 移除静态数据，只保留已通过的申请项目
                            appType: 'sci'
                        },
                        'social-work': {
                            title: '社会工作',
                            description: '查看您在社会工作中获得的详细加分信息',
                            scoreLabel: '社会工作总分',
                            detailsTitle: '社会工作加分明细',
                            items: [], // 移除静态数据，只保留已通过的申请项目
                            appType: 'social'
                        },
                        'honor-title': {
                            title: '荣誉称号',
                            description: '查看您获得的荣誉称号及对应的加分信息',
                            scoreLabel: '荣誉称号总分',
                            detailsTitle: '荣誉称号加分明细',
                            items: [], // 移除静态数据，只保留已通过的申请项目
                            appType: 'honor'
                        },
                        'other': {
                            title: '其他加分',
                            description: '查看其他类型的加分项及分数',
                            scoreLabel: '其他加分总分',
                            detailsTitle: '其他加分明细',
                            items: [], // 移除静态数据，只保留已通过的申请项目
                            appType: 'other'
                        }
                    };

                    // 获取当前分类数据
                    const currentData = categoryMap[category];

                    // 更新标题和描述
                    document.getElementById('categoryTitle').textContent = `${currentData.title}成绩单`;
                    document.getElementById('categoryDescription').textContent = currentData.description;
                    document.getElementById('categoryScoreLabel').textContent = currentData.scoreLabel;
                    document.getElementById('detailsTitle').textContent = currentData.detailsTitle;

                    // 获取已通过的申请记录并转换为加分明细项格式
                    let allItems = [...currentData.items];
                    let allApprovedApplications = [];
                    
                    if (applicationsData.code === 200) {
                        const applications = applicationsData.data.list;
                        console.log('获取到的申请记录:', applications);
                        
                        // 获取所有已通过的申请记录
                        allApprovedApplications = applications
                            .filter(app => app.status === 'approved')
                            .map(app => ({
                                name: app.title,
                                date: `${app.apply_time}`,
                                score: app.score || 0,
                                type: app.type
                            }));
                        
                        // 筛选出当前分类的已通过申请记录
                        const currentCategoryApplications = allApprovedApplications
                            .filter(app => app.type === currentData.appType);
                        
                        // 将申请记录添加到当前分类的加分项列表
                        allItems = [...allItems, ...currentCategoryApplications];
                    }

                    // 计算新的分类总分
                    const newCategoryTotal = allItems.reduce((sum, item) => sum + (item.score || 0), 0);
                    document.getElementById('categoryScore').textContent = newCategoryTotal.toFixed(1);

                    // 计算所有分类的总加分
                    const totalBonusScore = allApprovedApplications.reduce((sum, item) => sum + (item.score || 0), 0);
                    
                    // 计算总成绩（学业成绩 + 所有分类总加分）
                    const totalScore = academicScore + totalBonusScore;
                    document.getElementById('totalScore').textContent = totalScore.toFixed(1);

                    // 动态生成加分项目列表
                    const gradeList = document.getElementById('gradeList');
                    gradeList.innerHTML = '';
                    
                    allItems.forEach(item => {
                        const gradeItem = document.createElement('div');
                        gradeItem.className = 'grade-item';
                        
                        gradeItem.innerHTML = `
                            <div class="grade-info">
                                <div class="grade-name">${item.name}</div>
                                <div class="grade-date">${item.date}</div>
                            </div>
                            <div class="grade-score">+${item.score.toFixed(1)}</div>
                        `;
                        
                        gradeList.appendChild(gradeItem);
                    });
                } else {
                    console.error('获取分数数据失败:', scoreData.message);
                    // 使用默认数据
                    useDefaultData(category);
                }
            } catch (error) {
                console.error('获取数据时出错:', error);
                // 使用默认数据
                useDefaultData(category);
            }
        }
        
        // 使用默认数据的函数
        function useDefaultData(category) {
            // 根据分类获取分类信息
            const getCategoryInfo = (category) => {
                const categoryMap = {
                    'scientific-competition': {
                        title: '科研竞赛',
                        description: '查看您在科研竞赛中获得的详细加分信息',
                        scoreLabel: '科研竞赛总分',
                        detailsTitle: '科研竞赛加分明细',
                        items: [] // 移除静态数据
                    },
                    'social-work': {
                        title: '社会工作',
                        description: '查看您在社会工作中获得的详细加分信息',
                        scoreLabel: '社会工作总分',
                        detailsTitle: '社会工作加分明细',
                        items: [] // 移除静态数据
                    },
                    'honor-title': {
                        title: '荣誉称号',
                        description: '查看您获得的荣誉称号及对应的加分信息',
                        scoreLabel: '荣誉称号总分',
                        detailsTitle: '荣誉称号加分明细',
                        items: [] // 移除静态数据
                    },
                    'other': {
                        title: '其他加分',
                        description: '查看其他类型的加分项及分数',
                        scoreLabel: '其他加分总分',
                        detailsTitle: '其他加分明细',
                        items: [] // 移除静态数据
                    }
                };
                
                return categoryMap[category] || categoryMap['scientific-competition'];
            };
            
            const categoryInfo = getCategoryInfo(category);
            
            // 更新标题和描述
            document.getElementById('categoryTitle').textContent = `${categoryInfo.title}成绩单`;
            document.getElementById('categoryDescription').textContent = categoryInfo.description;
            document.getElementById('categoryScoreLabel').textContent = categoryInfo.scoreLabel;
            document.getElementById('detailsTitle').textContent = categoryInfo.detailsTitle;
            
            // 更新分类总分
            const categoryScore = categoryInfo.items.reduce((sum, item) => sum + item.score, 0);
            document.getElementById('categoryScore').textContent = categoryScore.toFixed(1);
            
            // 动态生成加分项目列表
            const gradeList = document.getElementById('gradeList');
            gradeList.innerHTML = '';
            
            categoryInfo.items.forEach(item => {
                const gradeItem = document.createElement('div');
                gradeItem.className = 'grade-item';
                
                gradeItem.innerHTML = `
                    <div class="grade-info">
                        <div class="grade-name">${item.name}</div>
                        <div class="grade-date">${item.date}</div>
                    </div>
                    <div class="grade-score">+${item.score.toFixed(1)}</div>
                `;
                
                gradeList.appendChild(gradeItem);
            });
            
            // 固定学业成绩为85.0
            const academicScore = 85.0;
            document.getElementById('academicScore').textContent = academicScore.toFixed(1);
            
            // 计算所有分类的总分（科研竞赛5分 + 社会工作3分 + 荣誉称号5分 + 其他加分2分）
            const allCategoriesTotal = 5.0 + 3.0 + 5.0 + 2.0;
            
            // 计算总成绩（学业成绩 + 所有分类总分）
            const totalScore = academicScore + allCategoriesTotal;
            document.getElementById('totalScore').textContent = totalScore.toFixed(1);
        }
        
        // 返回按钮事件
        document.getElementById('backButton').addEventListener('click', function() {
            window.location.href = 'transcript-category.html';
        });
        
        // 页面加载时更新内容
        window.addEventListener('DOMContentLoaded', updatePageContent);
    </script>
</body>
</html>
